<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🍀 같은 그림 짝 맞추기 🍀</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #20302a;
    font-family: 'Comic Sans MS', '맑은 고딕', 'Apple SD Gothic Neo', sans-serif;
    display: flex; justify-content: center; align-items: center; touch-action: manipulation;
  }
  #app {
    position: relative; width: 450px; height: 800px;
    max-width: 100vw; max-height: 100vh;
    background: linear-gradient(160deg, #2e7d52 0%, #1f5d3c 55%, #184a30 100%);
    overflow: hidden;
    box-shadow: 0 0 50px rgba(76, 175, 80, 0.4);
    display: flex; flex-direction: column;
  }

  /* ===== 상단 HUD ===== */
  #hud {
    display: flex; justify-content: space-between; align-items: stretch;
    gap: 8px; padding: 12px 14px 6px;
  }
  .stat {
    flex: 1; background: rgba(0,0,0,0.28); border: 2px solid rgba(255,255,255,0.22);
    border-radius: 16px; padding: 7px 6px; text-align: center; color: #fff;
  }
  .stat .lbl { font-size: 12px; opacity: 0.85; letter-spacing: 1px; }
  .stat .val { font-size: 26px; font-weight: bold; color: #FFEB3B; text-shadow: 1px 1px 0 #000; line-height: 1.1; }
  .stat.best .val { color: #FFD54F; }
  .stat.moves .val { color: #FFFFFF; }

  #subBar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 16px 4px; color: #d9f5e3; font-size: 14px; font-weight: bold;
  }
  #subBar #diffTag { background: rgba(0,0,0,0.3); padding: 3px 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.25); }
  #muteBtn {
    width: 34px; height: 34px; border-radius: 50%; background: rgba(0,0,0,0.35);
    border: 2px solid rgba(255,255,255,0.45); color: #fff; font-size: 16px; cursor: pointer;
    display: flex; justify-content: center; align-items: center;
  }

  /* ===== 카드 보드 ===== */
  #boardWrap { flex: 1; display: flex; justify-content: center; align-items: center; padding: 6px 14px 14px; }
  #board {
    display: grid; gap: 10px; width: 100%; height: 100%;
    align-content: center; justify-content: center;
  }
  .card {
    position: relative; border-radius: 14px; cursor: pointer;
    perspective: 600px; aspect-ratio: 3 / 4;
  }
  .card .inner {
    position: absolute; inset: 0; transition: transform 0.45s cubic-bezier(.2,.7,.3,1.2);
    transform-style: preserve-3d;
  }
  .card.flipped .inner, .card.matched .inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; border-radius: 14px;
    display: flex; justify-content: center; align-items: center;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    box-shadow: 0 4px 10px rgba(0,0,0,0.35);
  }
  .face.back {
    background: linear-gradient(145deg, #66bb6a, #43a047);
    border: 3px solid #ffffff; font-size: 30px; color: rgba(255,255,255,0.9);
  }
  .face.front {
    background: linear-gradient(145deg, #fffef5, #fff3d6);
    border: 3px solid #ffd54f; transform: rotateY(180deg);
    font-size: 44px;
  }
  .card.matched .face.front {
    background: linear-gradient(145deg, #fff9c4, #ffe082);
    border-color: #ffb300;
    animation: pop 0.45s ease;
  }
  .card.matched { animation: matchedGlow 1.2s ease infinite alternate; }
  @keyframes matchedGlow { from { filter: drop-shadow(0 0 2px #FFD54F); } to { filter: drop-shadow(0 0 12px #FFC107); } }
  @keyframes pop { 0%{transform:rotateY(180deg) scale(1);} 50%{transform:rotateY(180deg) scale(1.18);} 100%{transform:rotateY(180deg) scale(1);} }
  .card.wrong .face.front { animation: shake 0.4s; border-color:#e57373; }
  @keyframes shake { 0%,100%{margin-left:0;} 25%{margin-left:-6px;} 75%{margin-left:6px;} }

  /* ===== 오버레이 (시작/완료) ===== */
  .overlay {
    position: absolute; inset: 0; background: rgba(15, 45, 28, 0.94);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    z-index: 30; text-align: center; padding: 24px; gap: 4px;
  }
  .overlay.hidden { display: none; }
  .overlay h1 { font-size: 38px; color: #A5D6A7; text-shadow: 2px 2px 0 #1B5E20, 0 0 22px rgba(165,214,167,0.6); margin-bottom: 2px; }
  .overlay .sub { font-size: 16px; color: #fff; opacity: 0.9; margin-bottom: 14px; line-height: 1.6; }
  .overlay .sub b { color: #FFD54F; }

  .diffGroup { display: flex; flex-direction: column; gap: 12px; width: 280px; max-width: 88%; margin: 6px 0 4px; }
  .diffBtn {
    display: flex; justify-content: space-between; align-items: center;
    background: linear-gradient(135deg, #66bb6a, #43a047); color: #fff;
    border: 3px solid rgba(255,255,255,0.55); padding: 15px 20px; font-size: 20px; font-weight: bold;
    border-radius: 40px; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    font-family: inherit; transition: transform 0.1s; letter-spacing: 1px;
  }
  .diffBtn:active { transform: scale(0.96); }
  .diffBtn .meta { font-size: 13px; opacity: 0.92; font-weight: normal; }
  .diffBtn.easy   { background: linear-gradient(135deg, #4FC3F7, #29B6F6); }
  .diffBtn.normal { background: linear-gradient(135deg, #66BB6A, #43A047); }
  .diffBtn.hard   { background: linear-gradient(135deg, #FF8A65, #F4511E); }
  .diffBtn .bestMini { font-size: 12px; color: #fff8e1; font-weight: bold; }

  .btn {
    background: linear-gradient(135deg, #FFD54F, #FFB300); color: #4e342e;
    border: none; padding: 15px 44px; font-size: 22px; font-weight: bold;
    border-radius: 44px; cursor: pointer; margin-top: 14px;
    box-shadow: 0 8px 22px rgba(255,179,0,0.5); font-family: inherit;
    transition: transform 0.1s; letter-spacing: 1px;
  }
  .btn:active { transform: scale(0.95); }
  .btnGhost {
    background: rgba(255,255,255,0.12); color: #fff; border: 2px solid rgba(255,255,255,0.5);
    padding: 11px 26px; font-size: 16px; font-weight: bold; border-radius: 30px;
    cursor: pointer; margin-top: 10px; font-family: inherit;
  }
  .btnGhost:active { transform: scale(0.95); }

  /* 완료 화면 통계 */
  #winStats {
    background: rgba(255,255,255,0.1); border: 2px solid rgba(255,213,79,0.6);
    border-radius: 18px; padding: 16px 26px; margin: 10px 0; color: #fff;
    font-size: 17px; line-height: 2;
  }
  #winStats b { color: #FFD54F; font-size: 22px; }
  #winBig { font-size: 56px; }
  #newBest { color: #FF8A65; font-size: 20px; font-weight: bold; margin: 4px 0; display: none; animation: pulse 0.6s infinite alternate; }
  @keyframes pulse { from { transform: scale(1);} to { transform: scale(1.12);} }
  #stars { font-size: 38px; letter-spacing: 4px; margin: 6px 0; }

  /* 상단 토스트 */
  #toast {
    position: absolute; top: 110px; left: 50%; transform: translateX(-50%) scale(0.7);
    background: rgba(0,0,0,0.7); color: #FFEB3B; font-weight: bold; font-size: 20px;
    padding: 8px 22px; border-radius: 30px; z-index: 25; opacity: 0; pointer-events: none;
    transition: all 0.3s; white-space: nowrap; border: 2px solid rgba(255,235,59,0.6);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) scale(1); }
</style>
</head>
<body>
<div id="app">

  <!-- HUD -->
  <div id="hud">
    <div class="stat"><div class="lbl">⏱ 시간</div><div class="val" id="timeVal">0:00</div></div>
    <div class="stat moves"><div class="lbl">🔄 횟수</div><div class="val" id="moveVal">0</div></div>
    <div class="stat best"><div class="lbl">🏆 최고</div><div class="val" id="bestVal">-</div></div>
  </div>
  <div id="subBar">
    <span id="diffTag">보통</span>
    <span>🍀 <span id="matchVal">0</span>/<span id="pairVal">8</span> 짝</span>
    <button id="muteBtn">🔊</button>
  </div>

  <!-- 보드 -->
  <div id="boardWrap"><div id="board"></div></div>

  <!-- 시작 화면 -->
  <div class="overlay" id="startScreen">
    <h1>🍀 짝 맞추기 🍀</h1>
    <div class="sub">같은 그림 두 장을 찾아주세요.<br>천천히, 가볍게 즐기세요 😊</div>
    <div class="diffGroup" id="diffGroup">
      <button class="diffBtn easy"   data-diff="easy"><span>🌱 쉬움<div class="meta">3 × 4 · 6쌍</div></span><span class="bestMini" id="be_easy">기록 없음</span></button>
      <button class="diffBtn normal" data-diff="normal"><span>🍀 보통<div class="meta">4 × 4 · 8쌍</div></span><span class="bestMini" id="be_normal">기록 없음</span></button>
      <button class="diffBtn hard"   data-diff="hard"><span>🔥 어려움<div class="meta">4 × 6 · 12쌍</div></span><span class="bestMini" id="be_hard">기록 없음</span></button>
    </div>
    <div class="sub" style="font-size:13px;opacity:0.7;margin-top:6px;">시작하면 잠깐 카드를 보여드려요 👀</div>
  </div>

  <!-- 완료 화면 -->
  <div class="overlay hidden" id="winScreen">
    <div id="winBig">🎉</div>
    <h1>완성!</h1>
    <div id="stars">⭐⭐⭐</div>
    <div id="newBest">🏆 신기록 달성!</div>
    <div id="winStats">
      ⏱ 걸린 시간 <b id="winTime">0:00</b><br>
      🔄 뒤집은 횟수 <b id="winMoves">0</b>
    </div>
    <button class="btn" id="replayBtn">한 번 더 🔁</button>
    <button class="btnGhost" id="homeBtn">다른 난이도 고르기</button>
  </div>

  <div id="toast"></div>
</div>

<script>
(function(){
  "use strict";

  // ===== 카드 그림 풀 (귀여운 이모지) =====
  var EMOJIS = ["🍎","🍓","🍌","🍇","🍑","🍉","🍊","🥝","🍒","🥕","🌽","🍄","🌻","🌷","🌸","🐸","🐱","🐶","🐰","🐥","🐢","🦋","🐝","🐳"];

  var DIFFS = {
    easy:   { cols: 3, rows: 4, name: "쉬움",   stars: { 3: 9,  2: 14 } },
    normal: { cols: 4, rows: 4, name: "보통",   stars: { 3: 14, 2: 22 } },
    hard:   { cols: 4, rows: 6, name: "어려움", stars: { 3: 22, 2: 34 } }
  };

  var el = function(id){ return document.getElementById(id); };
  var board = el("board");

  var state = {
    diff: "normal",
    cards: [],
    first: null,
    lock: false,
    moves: 0,
    matched: 0,
    pairs: 0,
    startTime: 0,
    timer: null,
    elapsed: 0,
    running: false
  };

  // ===== 사운드 (Web Audio, 의존성 없음) =====
  var muted = (localStorage.getItem("mem_muted") === "1");
  var audioCtx = null;
  function ac(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return audioCtx; }
  function beep(freq, dur, type, vol){
    if(muted) return;
    var c = ac(); if(!c) return;
    try {
      var o = c.createOscillator(), g = c.createGain();
      o.type = type || "sine"; o.frequency.value = freq;
      g.gain.value = vol || 0.12;
      o.connect(g); g.connect(c.destination);
      var t = c.currentTime;
      o.start(t);
      g.gain.setValueAtTime(g.gain.value, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.stop(t + dur);
    } catch(e){}
  }
  function sFlip(){ beep(420, 0.08, "triangle", 0.10); }
  function sMatch(){ beep(660, 0.10, "sine", 0.13); setTimeout(function(){ beep(880, 0.16, "sine", 0.13); }, 90); }
  function sWrong(){ beep(200, 0.18, "sawtooth", 0.08); }
  function sWin(){
    var notes = [523, 659, 784, 1046];
    notes.forEach(function(f, i){ setTimeout(function(){ beep(f, 0.22, "sine", 0.14); }, i*140); });
  }

  function updateMuteBtn(){ el("muteBtn").textContent = muted ? "🔇" : "🔊"; }
  el("muteBtn").addEventListener("click", function(e){
    e.stopPropagation();
    muted = !muted; localStorage.setItem("mem_muted", muted ? "1" : "0");
    updateMuteBtn();
    if(!muted) sFlip();
  });
  updateMuteBtn();

  // ===== 기록 저장 =====
  function bestKey(d){ return "mem_best_" + d; }
  function getBest(d){
    try {
      var raw = localStorage.getItem(bestKey(d));
      return raw ? JSON.parse(raw) : null;
    } catch(e){ return null; }
  }
  function fmtTime(sec){
    var m = Math.floor(sec/60), s = sec%60;
    return m + ":" + (s<10 ? "0"+s : s);
  }
  function refreshBestLabels(){
    ["easy","normal","hard"].forEach(function(d){
      var b = getBest(d);
      el("be_"+d).textContent = b ? ("⏱"+fmtTime(b.time)+" · "+b.moves+"회") : "기록 없음";
    });
  }

  // ===== 토스트 =====
  var toastTimer = null;
  function toast(msg){
    var t = el("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 1100);
  }

  // ===== 보드 생성 =====
  function shuffle(arr){
    for(var i=arr.length-1; i>0; i--){
      var j = Math.floor(Math.random()*(i+1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

  function buildBoard(diff){
    var cfg = DIFFS[diff];
    var total = cfg.cols * cfg.rows;
    var pairCount = total / 2;
    state.pairs = pairCount;

    var pool = shuffle(EMOJIS.slice()).slice(0, pairCount);
    var deck = shuffle(pool.concat(pool));

    board.style.gridTemplateColumns = "repeat(" + cfg.cols + ", 1fr)";
    board.innerHTML = "";
    state.cards = [];

    deck.forEach(function(emoji, idx){
      var card = document.createElement("div");
      card.className = "card";
      card.innerHTML =
        '<div class="inner">' +
          '<div class="face back">❓</div>' +
          '<div class="face front">' + emoji + '</div>' +
        '</div>';
      var obj = { emoji: emoji, matched: false, el: card, index: idx };
      card.addEventListener("click", function(){ onCardClick(obj); });
      board.appendChild(card);
      state.cards.push(obj);
    });
  }

  // ===== 타이머 =====
  function startTimer(){
    state.running = true;
    state.startTime = (window.performance ? performance.now() : new Date().getTime());
    state.timer = setInterval(function(){
      if(!state.running) return;
      var now = (window.performance ? performance.now() : new Date().getTime());
      state.elapsed = Math.floor((now - state.startTime)/1000);
      el("timeVal").textContent = fmtTime(state.elapsed);
    }, 250);
  }
  function stopTimer(){ state.running = false; if(state.timer){ clearInterval(state.timer); state.timer = null; } }

  // ===== 게임 시작 =====
  function startGame(diff){
    state.diff = diff;
    state.first = null;
    state.lock = true;
    state.moves = 0;
    state.matched = 0;
    state.elapsed = 0;
    stopTimer();

    var cfg = DIFFS[diff];
    el("diffTag").textContent = cfg.name;
    el("pairVal").textContent = cfg.cols*cfg.rows/2;
    el("matchVal").textContent = "0";
    el("moveVal").textContent = "0";
    el("timeVal").textContent = "0:00";
    var b = getBest(diff);
    el("bestVal").textContent = b ? (b.moves+"회") : "-";

    buildBoard(diff);
    el("startScreen").classList.add("hidden");
    el("winScreen").classList.add("hidden");

    // 잠깐 미리보기: 전부 보여줬다가 닫기 (난이도별 차등)
    var peek = diff === "hard" ? 2500 : (diff === "normal" ? 1800 : 1400);
    setTimeout(function(){
      state.cards.forEach(function(c){ c.el.classList.add("flipped"); });
    }, 100);
    setTimeout(function(){
      state.cards.forEach(function(c){ if(!c.matched) c.el.classList.remove("flipped"); });
      state.lock = false;
      startTimer();
      toast("시작! 천천히 하세요 😊");
    }, peek);
  }

  // ===== 카드 클릭 =====
  function onCardClick(obj){
    if(state.lock) return;
    if(obj.matched) return;
    if(obj.el.classList.contains("flipped")) return;
    if(!state.running) return;

    obj.el.classList.add("flipped");
    sFlip();

    if(state.first === null){
      state.first = obj;
      return;
    }

    state.moves++;
    el("moveVal").textContent = state.moves;
    var a = state.first, bCard = obj;
    state.first = null;

    if(a.emoji === bCard.emoji){
      state.lock = true;
      setTimeout(function(){
        a.el.classList.add("matched"); bCard.el.classList.add("matched");
        a.matched = true; bCard.matched = true;
        state.matched++;
        el("matchVal").textContent = state.matched;
        sMatch();
        state.lock = false;
        if(state.matched === state.pairs){ win(); }
      }, 180);
    } else {
      state.lock = true;
      a.el.classList.add("wrong"); bCard.el.classList.add("wrong");
      sWrong();
      setTimeout(function(){
        a.el.classList.remove("flipped","wrong");
        bCard.el.classList.remove("flipped","wrong");
        state.lock = false;
      }, 750);
    }
  }

  // ===== 별점 계산 =====
  function calcStars(diff, moves){
    var s = DIFFS[diff].stars;
    if(moves <= s[3]) return 3;
    if(moves <= s[2]) return 2;
    return 1;
  }

  // ===== 완료 =====
  function win(){
    stopTimer();
    var diff = state.diff;
    var stars = calcStars(diff, state.moves);

    var prev = getBest(diff);
    var isBest = false;
    if(!prev || state.moves < prev.moves || (state.moves === prev.moves && state.elapsed < prev.time)){
      isBest = true;
      try { localStorage.setItem(bestKey(diff), JSON.stringify({ moves: state.moves, time: state.elapsed })); } catch(e){}
    }

    el("winTime").textContent = fmtTime(state.elapsed);
    el("winMoves").textContent = state.moves;
    el("stars").textContent = "⭐".repeat(stars) + "☆".repeat(3-stars);
    el("winBig").textContent = stars === 3 ? "🏆" : "🎉";
    el("newBest").style.display = isBest ? "block" : "none";

    refreshBestLabels();
    sWin();

    setTimeout(function(){ el("winScreen").classList.remove("hidden"); }, 650);
  }

  // ===== 버튼 핸들러 =====
  var diffBtns = document.querySelectorAll(".diffBtn");
  for(var i=0;i<diffBtns.length;i++){
    diffBtns[i].addEventListener("click", function(){
      ac();
      startGame(this.getAttribute("data-diff"));
    });
  }
  el("replayBtn").addEventListener("click", function(){ startGame(state.diff); });
  el("homeBtn").addEventListener("click", function(){
    el("winScreen").classList.add("hidden");
    el("startScreen").classList.remove("hidden");
    refreshBestLabels();
  });

  refreshBestLabels();

})();
</script>
</body>
</html>
