<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🎮 게임 고르기</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #16241c;
    font-family: 'Comic Sans MS', '맑은 고딕', 'Apple SD Gothic Neo', sans-serif;
    display: flex; justify-content: center; align-items: center; touch-action: manipulation;
  }
  #app {
    position: relative; width: 450px; height: 800px;
    max-width: 100vw; max-height: 100vh;
    background: linear-gradient(160deg, #2e7d52 0%, #1f5d3c 55%, #143f29 100%);
    overflow: hidden; box-shadow: 0 0 50px rgba(76,175,80,0.4);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 30px 24px;
  }
  .logo { font-size: 72px; margin-bottom: 4px; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.4)); }
  h1 {
    font-size: 34px; color: #A5D6A7; text-align: center;
    text-shadow: 2px 2px 0 #1B5E20, 0 0 22px rgba(165,214,167,0.6); margin-bottom: 4px;
  }
  .tagline { font-size: 15px; color: #d9f5e3; opacity: 0.9; text-align: center; margin-bottom: 30px; }

  .menu { display: flex; flex-direction: column; gap: 18px; width: 300px; max-width: 90%; }
  .gameCard {
    display: flex; align-items: center; gap: 16px;
    padding: 20px 22px; border-radius: 26px; cursor: pointer; text-decoration: none;
    border: 3px solid rgba(255,255,255,0.55); box-shadow: 0 8px 22px rgba(0,0,0,0.35);
    transition: transform 0.12s;
  }
  .gameCard:active { transform: scale(0.96); }
  .gameCard .icon { font-size: 50px; flex-shrink: 0; filter: drop-shadow(0 3px 4px rgba(0,0,0,0.3)); }
  .gameCard .txt { flex: 1; color: #fff; text-align: left; }
  .gameCard .name { font-size: 24px; font-weight: bold; letter-spacing: 1px; }
  .gameCard .desc { font-size: 13px; opacity: 0.92; margin-top: 3px; line-height: 1.4; }
  .gameCard .go { font-size: 30px; color: #fff; opacity: 0.8; }

  .gameCard.snake  { background: linear-gradient(135deg, #66BB6A, #388E3C); }
  .gameCard.memory { background: linear-gradient(135deg, #FFB74D, #F57C00); }

  .footer { margin-top: 34px; font-size: 12px; color: rgba(255,255,255,0.55); text-align: center; line-height: 1.6; }
</style>
</head>
<body>
<div id="app">
  <div class="logo">🎮</div>
  <h1>게임 고르기</h1>
  <div class="tagline">하고 싶은 게임을 눌러주세요 😊</div>

  <div class="menu">
    <a class="gameCard memory" href="memory.html">
      <div class="icon">🍀</div>
      <div class="txt">
        <div class="name">짝 맞추기</div>
        <div class="desc">차분하게 즐기는 기억력 카드 게임</div>
      </div>
      <div class="go">›</div>
    </a>

    <a class="gameCard snake" href="snake.html">
      <div class="icon">🐍</div>
      <div class="txt">
        <div class="name">꼬마 뱀</div>
        <div class="desc">사과를 먹고 무럭무럭 자라요</div>
      </div>
      <div class="go">›</div>
    </a>
  </div>

  <div class="footer">언제든 게임 화면 왼쪽 위 🏠 버튼으로<br>이 메뉴로 돌아올 수 있어요</div>
</div>
</body>
</html>
